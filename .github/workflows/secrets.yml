# Is anything that looks like a credential in the repository?
#
# GitHub's secret scanning (with push protection, on for this repository)
# recognises the known formats of tokens. It does not recognise an ordinary
# password written in a script, and that is how one reached a public
# MTSistemi repository in August 2026. This looks for the SHAPE of one:
# see scripts/check-secrets.sh.
name: Credentials — is anything exposed?

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Look for the shape of a credential
        run: bash scripts/check-secrets.sh
